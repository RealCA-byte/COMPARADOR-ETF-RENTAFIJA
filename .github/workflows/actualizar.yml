name: Actualizar comparador de renta fija

# Corre solo cada lunes a las 13:00 UTC (7:00 en CDMX) y tambien a mano
# desde la pestana Actions con el boton "Run workflow".
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # para poder guardar los datos nuevos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Bajar datos y regenerar el HTML
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        # --minimo-ok 30 hace que el job falle (y GitHub te mande correo) si
        # menos de 30 de los 39 fondos se pudieron leer: senal de que un emisor
        # cambio su pagina. El HTML se regenera igual con los ultimos valores.
        run: python actualizar.py --minimo-ok 30

      - name: Guardar los datos nuevos en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json renta_fija.html
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp renta_fija.html _sitio/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
